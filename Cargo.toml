[workspace]
resolver = "2"
members = ["holofote", "holofote-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/holofote"
homepage = "https://github.com/pleme-io/holofote"
authors = ["pleme-io"]
description = "holofote (searchlight) — a typed Splunk REST client and observe-only MCP server: a closed route enum, a typed SPL AST with one renderer, version-derived result routes, and kotae's four outcomes at the border"

[workspace.dependencies]
holofote = { path = "holofote", version = "0.1.0" }

# ── the fleet answer vocabulary ────────────────────────────────────────
# kotae — the four distinguishable outcomes of a tool call. handan — what an
# HTTP status MEANS, owned once; holofote never re-derives it.
kotae = "0.1"
handan = "0.1"

# ── configuration: one struct, two faces (shikumi tiers + a (def…) form) ─
shikumi = "0.1"
tatara-lisp = "0.3"

# ── transport ──────────────────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# rustls is named ONLY so a TLS failure can be recognised by TYPE while
# walking reqwest's error chain — never to configure TLS by hand.
rustls = { version = "0.23", default-features = false }
# `net` is for exactly one thing: the bounded plain-TCP probe that turns a
# connect-class failure into evidence (`transport::ConnectEvidence`).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "net"] }
url = "2"
# `Bytes::from_owner` (1.9+): a secret crosses into the HTTP stack as a
# buffer whose zeroizing owner is dropped with the last reference.
bytes = "1.9"

# ── MCP ────────────────────────────────────────────────────────────────
rmcp = { version = "1.4", features = ["server", "transport-io", "macros"] }
schemars = "1"

# ── serde / errors / secrets / cli / logs ──────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── dev ────────────────────────────────────────────────────────────────
blake3 = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
